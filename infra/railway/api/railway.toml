# NestJS API — set in Railway: Settings → Config-as-code path → /infra/railway/api/railway.toml
# Repo root directory must stay "." so pnpm workspaces resolve.

[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @frodo/contracts build && pnpm --filter @frodo/config build && pnpm --filter @frodo/db build && pnpm --filter @frodo/domain build && pnpm --filter @frodo/api build"
watchPatterns = [
  "/apps/api/**",
  "/packages/**",
  "/infra/railway/**",
  "/railpack.json",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/tsconfig.base.json",
  "/pyproject.toml",
]

[deploy]
startCommand = "pnpm --filter @frodo/api start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
# Uses artifacts from the build image (pnpm db:migrate = node packages/db/dist/migrate.js).
# Also set RUN_DB_MIGRATIONS_ON_STARTUP=true on the service so migrations run even if pre-deploy is skipped.
preDeployCommand = "pnpm db:migrate"
